name: CD Deploy

on:
  workflow_run:
    workflows: ["CI — Lint & unit tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ci-success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      docker-image-tag: latest
    steps:
      - name: Check CI workflow success
        run: echo "CI workflow completed successfully"

  deploy-canary:
    needs: check-ci-success
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy backend to canary
        run: |
          echo "Deploying backend to canary environment..."
          az webapp config container set \
            --name Mobirehab \
            --resource-group Mobirehab_group \
            --docker-custom-image-name docker.io/${{ secrets.DOCKERHUB_USERNAME }}/healtheduld-backend:latest \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
          az webapp restart --name Mobirehab --resource-group Mobirehab_group

      - name: Wait for canary to start
        run: sleep 120

      - name: Health check - Backend
        run: |
          echo "Running health check on canary backend..."
          BACKEND_HOST=$(az webapp show --name Mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          echo "Backend host: ${BACKEND_HOST}"
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
