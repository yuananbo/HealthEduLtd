name: CD Deploy

on:
  workflow_run:
    workflows: ["CI — Lint & unit tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ci-success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      docker-image-tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check CI workflow success
        run: echo "CI workflow completed successfully"

  deploy-canary:
    needs: check-ci-success
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy backend to canary
        run: |
          echo "Deploying backend to canary environment..."
          az webapp config container set \
            --name Mobirehab \
            --resource-group Mobirehab_group \
            --docker-custom-image-name docker.io/${{ secrets.DOCKERHUB_USERNAME }}/healtheduld-backend:${{ needs.check-ci-success.outputs.docker-image-tag }} \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
          az webapp restart --name Mobirehab --resource-group Mobirehab_group

      - name: Print backend deployed image tag
        run: |
          echo "Current backend linuxFxVersion:"
          az webapp config container show \
            --name Mobirehab \
            --resource-group Mobirehab_group \
            --query "linuxFxVersion" \
            -o tsv

      - name: Wait for canary to start
        run: sleep 120

      - name: Health check - Backend
        run: |
          echo "Running health check on canary backend..."
          BACKEND_HOST=$(az webapp show --name Mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          echo "Backend host: ${BACKEND_HOST}"
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://${BACKEND_HOST}/health" || echo "000")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed! Backend is healthy."
              exit 0
            fi
            
            echo "⏳ Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES - Response: $RESPONSE"
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 10
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Performance check - Backend
        run: |
          echo "Running performance check..."
          BACKEND_HOST=$(az webapp show --name Mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          START=$(date +%s%N)
          curl -s "https://${BACKEND_HOST}/health" > /dev/null
          END=$(date +%s%N)
          
          DURATION=$((($END - $START) / 1000000))
          echo "Response time: ${DURATION}ms"
          
          if [ $DURATION -gt 5000 ]; then
            echo "⚠️ Warning: Response time is slow (${DURATION}ms > 5000ms)"
          else
            echo "✅ Response time is good (${DURATION}ms)"
          fi

  deploy-frontend-canary:
    needs: [check-ci-success, deploy-canary]
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy frontend to canary
        run: |
          echo "Deploying frontend to canary environment..."
          az webapp config container set \
            --name c01mobirehab \
            --resource-group Mobirehab_group \
            --docker-custom-image-name docker.io/${{ secrets.DOCKERHUB_USERNAME }}/healtheduld-frontend:${{ needs.check-ci-success.outputs.docker-image-tag }} \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
          az webapp restart --name c01mobirehab --resource-group Mobirehab_group

      - name: Print frontend deployed image tag
        run: |
          echo "Current frontend linuxFxVersion:"
          az webapp config container show \
            --name c01mobirehab \
            --resource-group Mobirehab_group \
            --query "linuxFxVersion" \
            -o tsv

      - name: Wait for canary frontend to start
        run: sleep 60

      - name: Health check - Frontend
        run: |
          echo "Running health check on canary frontend..."
          FRONTEND_HOST=$(az webapp show --name c01mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          echo "Frontend host: ${FRONTEND_HOST}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://${FRONTEND_HOST}/" || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Frontend health check passed!"
            exit 0
          else
            echo "❌ Frontend health check failed with response: $RESPONSE"
            exit 1
          fi

  canary-analysis:
    needs: [deploy-canary, deploy-frontend-canary]
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Container startup success check
        run: |
          BACKEND_STATE=$(az webapp show --name Mobirehab --resource-group Mobirehab_group --query state -o tsv)
          FRONTEND_STATE=$(az webapp show --name c01mobirehab --resource-group Mobirehab_group --query state -o tsv)
          echo "Backend state: ${BACKEND_STATE}"
          echo "Frontend state: ${FRONTEND_STATE}"
          if [ "$BACKEND_STATE" != "Running" ] || [ "$FRONTEND_STATE" != "Running" ]; then
            echo "❌ Canary startup check failed: webapp is not Running"
            exit 1
          fi
          echo "✅ Container startup success check passed"

      - name: Smoke/API test success
        run: |
          BACKEND_HOST=$(az webapp show --name Mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          FRONTEND_HOST=$(az webapp show --name c01mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          BACKEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${BACKEND_HOST}/health" || echo "000")
          FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${FRONTEND_HOST}/" || echo "000")
          echo "Backend smoke code: ${BACKEND_CODE}"
          echo "Frontend smoke code: ${FRONTEND_CODE}"
          if [ "$BACKEND_CODE" != "200" ] || [ "$FRONTEND_CODE" != "200" ]; then
            echo "❌ Smoke/API test failed"
            exit 1
          fi
          echo "✅ Smoke/API test success"

      - name: Error-free logs over short interval
        run: |
          echo "Collecting logs for short-interval scan..."
          sleep 20
          az webapp log download --name Mobirehab --resource-group Mobirehab_group --log-file backend-logs.zip
          az webapp log download --name c01mobirehab --resource-group Mobirehab_group --log-file frontend-logs.zip
          mkdir -p backend-logs frontend-logs
          unzip -oq backend-logs.zip -d backend-logs
          unzip -oq frontend-logs.zip -d frontend-logs
          BACKEND_LOG_FILE=$(find backend-logs -type f -name "*_docker.log" -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          FRONTEND_LOG_FILE=$(find frontend-logs -type f -name "*_docker.log" -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -z "$BACKEND_LOG_FILE" ]; then
            BACKEND_LOG_FILE=$(find backend-logs -type f -name "*.log" -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          fi
          if [ -z "$FRONTEND_LOG_FILE" ]; then
            FRONTEND_LOG_FILE=$(find frontend-logs -type f -name "*.log" -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          fi
          echo "Latest backend log file: ${BACKEND_LOG_FILE:-none}"
          echo "Latest frontend log file: ${FRONTEND_LOG_FILE:-none}"
          BACKEND_RECENT=$( [ -n "$BACKEND_LOG_FILE" ] && tail -n 20 "$BACKEND_LOG_FILE" || true )
          FRONTEND_RECENT=$( [ -n "$FRONTEND_LOG_FILE" ] && tail -n 20 "$FRONTEND_LOG_FILE" || true )
          RECENT_LOGS="${BACKEND_RECENT}"$'\n'"${FRONTEND_RECENT}"
          # Strict crash/error matching:
          # - Platform-reported error level (ERR)
          # - High-confidence runtime crash signatures
          MATCHES=$(printf '%s\n' "$RECENT_LOGS" | grep -n -E -i "(DetailsLevel:\\s*ERR)|(Unhandled[^\\n]*Exception)|Traceback|panic|segmentation fault|OOMKilled|JavaScript heap out of memory" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Error patterns found in canary logs"
            printf '%s\n' "$MATCHES" | sed -n '1,20p'
            exit 1
          fi
          echo "✅ Error-free logs check passed (short interval)"

      - name: Upload canary logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-logs
          path: |
            backend-logs.zip
            frontend-logs.zip
            backend-logs
            frontend-logs

  promote-to-production:
    needs: [check-ci-success, canary-analysis]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Promote canary to production - Backend
        run: |
          echo "Promoting canary backend to production (Mobirehab)..."
          az webapp config container set \
            --name Mobirehab \
            --resource-group Mobirehab_group \
            --docker-custom-image-name docker.io/${{ secrets.DOCKERHUB_USERNAME }}/healtheduld-backend:${{ needs.check-ci-success.outputs.docker-image-tag }} \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
          az webapp restart --name Mobirehab --resource-group Mobirehab_group

      - name: Promote canary to production - Frontend
        run: |
          echo "Promoting canary frontend to production (c01mobirehab)..."
          az webapp config container set \
            --name c01mobirehab \
            --resource-group Mobirehab_group \
            --docker-custom-image-name docker.io/${{ secrets.DOCKERHUB_USERNAME }}/healtheduld-frontend:${{ needs.check-ci-success.outputs.docker-image-tag }} \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
          az webapp restart --name c01mobirehab --resource-group Mobirehab_group

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          sleep 30
          BACKEND_HOST=$(az webapp show --name Mobirehab --resource-group Mobirehab_group --query defaultHostName -o tsv)
          echo "Backend host: ${BACKEND_HOST}"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://${BACKEND_HOST}/health" || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Production deployment verified successfully!"
            exit 0
          else
            echo "❌ Production verification failed with response: $RESPONSE (expected 200)"
            exit 1
          fi

  rollback-on-failure:
    if: failure()
    needs: [promote-to-production]
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Rollback production to previous version
        run: |
          echo "❌ Deployment failed! Rolling back production..."
          echo "Note: Manual rollback may be required depending on your Azure setup"
          echo "Check Azure Web App deployment history for previous versions"

      - name: Notify failure
        run: |
          echo "🚨 CD Pipeline failed!"
          echo "Canary deployment or health checks failed"
          echo "Please check the logs above for details"
          exit 1


