name: CD — Build with docker-compose and push to Docker Hub

on:
  push:
    branches:
      #- feature/cd-canary-deploy
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_push:
    name: Build images with docker-compose and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate docker-compose.ci.yml
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            backend:
              image: ${DOCKERHUB_USERNAME}/healtheduld-backend:${GIT_SHA}
              build:
                context: .
                dockerfile: ./Dockerfile
            frontend:
              image: ${DOCKERHUB_USERNAME}/healtheduld-frontend:${GIT_SHA}
              build:
                context: ./frontend
                dockerfile: Dockerfile
          EOF
      - name: Debug package versions before docker build
        run: |
          echo "=== ROOT package.json ==="
          grep -n '"typescript"' package.json || true
          echo "=== ROOT package-lock.json ==="
          grep -n '"typescript"' package-lock.json | head -n 20 || true
          echo "=== FRONTEND package.json ==="
          grep -n '"esbuild"\|"typescript"\|"autoprefixer"' frontend/package.json || true
          echo "=== FRONTEND package-lock.json ==="
          grep -n '"esbuild"\|"typescript"\|"autoprefixer"' frontend/package-lock.json | head -n 40 || true

      - name: Docker compose build
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.ci.yml build --pull

      # Optional: lightweight smoke test step (skippable)
      - name: Show built images
        run: docker images | head -n 20

      - name: Push images to Docker Hub (SHA tag)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker push ${DOCKERHUB_USERNAME}/healtheduld-backend:${GIT_SHA}
          docker push ${DOCKERHUB_USERNAME}/healtheduld-frontend:${GIT_SHA}

      - name: Tag as latest and push
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker pull ${DOCKERHUB_USERNAME}/healtheduld-backend:${GIT_SHA}
          docker pull ${DOCKERHUB_USERNAME}/healtheduld-frontend:${GIT_SHA}
          docker tag ${DOCKERHUB_USERNAME}/healtheduld-backend:${GIT_SHA} ${DOCKERHUB_USERNAME}/healtheduld-backend:latest
          docker tag ${DOCKERHUB_USERNAME}/healtheduld-frontend:${GIT_SHA} ${DOCKERHUB_USERNAME}/healtheduld-frontend:latest
          docker push ${DOCKERHUB_USERNAME}/healtheduld-backend:latest
          docker push ${DOCKERHUB_USERNAME}/healtheduld-frontend:latest

  # Optional follow-up job: deploy these images on any target (Azure/K8s/etc.)
  # This keeps the demo slide focus on "build with compose + publish to Docker Hub".

