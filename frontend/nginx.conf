worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  map $host $backend_origin {
    default "";
    ~^localhost$ http://host.docker.internal:8000;
    ~^127\.0\.0\.1$ http://host.docker.internal:8000;
    ~*azurewebsites\.net$ https://mobirehab-bbaahwfybghmb6cx.canadacentral-01.azurewebsites.net;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      if ($backend_origin = "") {
        return 502;
      }

      proxy_pass $backend_origin;
      proxy_http_version 1.1;
      proxy_set_header Host mobirehab-bbaahwfybghmb6cx.canadacentral-01.azurewebsites.net;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
