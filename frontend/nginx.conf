worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Default is 1m — therapist signup (3 files) exceeds that → 413 before request hits Node.
    client_max_body_size 50M;

    map $http_x_forwarded_proto $forwarded_proto_to_api {
        default $http_x_forwarded_proto;
        "" https;
    }

    # Production frontend image: /api/* is proxied only to the Azure API Web App (see Dockerfile BACKEND_PUBLIC_URL).
    # Local dev: use `npm run dev` (Vite) + API on :8000 — not this nginx container.

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass __BACKEND_PUBLIC_URL__;
            proxy_http_version 1.1;
            proxy_set_header Host __BACKEND_PUBLIC_HOST__;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto_to_api;
            proxy_ssl_server_name on;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
